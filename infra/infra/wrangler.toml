name = "fiff-si-gateway"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated waterfall in the configured order. This is a
# quota/reliability choice, not a capability ranking: qwen3.8-27b served
# the first verified live answer (2026-11-14); gpt-oss-120b returned
# HTTP 400 on that probe with the cause undiagnosed offline, so it is
# the last resort until diagnosed. Names verified 2026-11-14 against the
# live Groq /models listing with the fiff project's own key (read-only
# GET, HTTP 200) - never guessed. Free-tier org limits verified in-console
# 2026-11-14 (org Personal, free plan): each of the three models
# 30 RPM / 8K TPM / 1K RPD / 200K TPD.
GROQ_MODELS = "qwen/qwen3.8-27b,openai/gpt-oss-20b,openai/gpt-oss-120b"
# Honest free-tier guards, in provider units: at most this many provider
# calls (fallbacks included) and this many measured total tokens per UTC
# day; both fail closed. Minute guards are per model (Groq TPM is per
# model) and tightened by fresh x-ratelimit-remaining headers.
SI_DAILY_REQUESTS = "10"
SI_DAILY_TOKENS = "200000"
SI_RPM = "4"
SI_TPM = "8000"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetDO"]
